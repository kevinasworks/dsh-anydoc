name: npm publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/platform-ci.yml

  publish:
    needs: verify
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI that supports trusted publishing
        run: npm install --global npm@11.19.1
      - name: Verify the release matches a public package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'const p=require("./package.json"); if(p.name!=="dsh-anydoc" || p.private || process.env.RELEASE_TAG!=="v"+p.version) throw Error("Release tag must match a public dsh-anydoc package version")'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Publish with npm trusted publishing
        run: npm publish --access public --provenance

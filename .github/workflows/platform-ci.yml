# Platform CI for dsh-anydoc.
#
# It exists so the Windows side can be verified by the platform itself instead
# of by code review: macOS 15 (Apple silicon) and Windows x64 (x64)
# both install the real native binary and execute the full suite.
#
# What each job proves:
#   - npm install resolves the platform-specific @firecrawl/anydoc binding
#   - the 106-test suite runs on that platform (3 symlink/chmod tests skip on Windows)
#   - the installed binary's architecture matches the runner
#   - every claimed DSH line still loads the plugin entry (needs network)

name: platform

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record actual runtime
        run: node -p "JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,glibc:process.report.getReport().header.glibcVersionRuntime})"

      - name: Install production and development dependencies
        run: npm install --no-audit --no-fund

      - name: Test suite
        run: npm test

      # Not --offline: the registry is reachable here, and this also proves the
      # published binding for the *other* platform really exists.
      - name: Platform packaging
        run: node test/check-platforms.mjs

      - name: DSH generation compatibility
        run: node test/check-compat.mjs
        timeout-minutes: 15

  musl:
    name: Alpine musl / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Native Alpine runtime, full tests and DSH compatibility
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e EXPECTED_ARCH -e EXPECTED_PLATFORM=linux -v "$PWD:/work" -w /work node:22-alpine sh -ec '
            node -e "if(process.arch!==process.env.EXPECTED_ARCH||process.platform!==process.env.EXPECTED_PLATFORM||process.report.getReport().header.glibcVersionRuntime)throw Error();console.log(process.version,process.platform,process.arch)"
            npm ci --no-audit --no-fund
            npm test
            node test/check-platforms.mjs
            node test/check-compat.mjs
          '

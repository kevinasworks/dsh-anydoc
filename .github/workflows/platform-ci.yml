# Platform CI for dsh-anydoc.
#
# It exists so the Windows side can be verified by the platform itself instead
# of by code review: macOS 15 (Apple silicon) and Windows x64 (x64)
# both install the real native binary and execute the full suite.
#
# What each job proves:
#   - npm install resolves the platform-specific @firecrawl/anydoc binding
#   - the 106-test suite runs on that platform (3 symlink/chmod tests skip on Windows)
#   - the installed binary's architecture matches the runner
#   - every claimed DSH line still loads the plugin entry (needs network)

name: platform

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production and development dependencies
        run: npm install --no-audit --no-fund

      - name: Test suite
        run: npm test

      # Not --offline: the registry is reachable here, and this also proves the
      # published binding for the *other* platform really exists.
      - name: Platform packaging
        run: node test/check-platforms.mjs

      - name: DSH generation compatibility
        run: node test/check-compat.mjs
        timeout-minutes: 15
